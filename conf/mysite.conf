server{
	listen 80;
	server_name localhost;
	
	location / {
		root /usr/share/nginx/html;
		index index.html index.htm ;
		}
	error_page 500 502 503 504 /50x.html;
	location /50x.html {
		root /usr/share/nginx/html;
		}

	location /api/ {
        # 如果 Nginx 和 FastAPI 都在宿主机上，或者通过宿主机内网 IP 转发：
        proxy_pass http://back_end:8000;
		
    }
}

