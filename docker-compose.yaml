services:
  front_end:
    build: ./res
    restart: always
    ports:
      - "8080:80"
    networks:
      - frontend
      - backend
    volumes:
      - ./res:/app
      - ./conf/mysite.conf:/etc/nginx/conf.d/default.conf:ro
    # develop:
    #   watch:
    #     - action: sync+restart
    #       path: ./conf/mysite.conf
    #       target: /etc/nginx/conf.d/default.conf
    #       initial_sync: true  # 在开始之前，强制同步所有文件
    depends_on:
      - back_end
  back_end:
    build: ./res/backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./res/backend:/app
    networks:
      - backend
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password123
      - DB_NAME=test_db
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "password123"
      MYSQL_DATABASE: "test_db"
    volumes:
      - mysql_data:/var/lib/data
    ports:
      - "3306:3306"
    networks:
      - backend

networks:
  frontend:
  backend:
volumes:
  mysql_data: